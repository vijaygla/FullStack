<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Bubbling and Event Capturing</title>
  <style>
    #outerDiv {
      background-color: pink;
      padding: 25px;
      margin: 15px 0;
    }
    #middleDiv {
      background-color: yellow;
      padding: 25px;
      margin: 15px 0;
    }
    #innerDiv {
      background-color: red;
      padding: 20px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div id="outerDiv">
    <h1>Outer Div</h1>
    <div id="middleDiv">
      <h1>Middle Div</h1>
      <div id="innerDiv">
        <h1>Inner Div</h1>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("outerDiv").addEventListener("click", () => {
      console.log("Outer Most div is clicked");
    }, true);

    document.getElementById("middleDiv").addEventListener("click", () => {
      console.log("Middle div is clicked");
    }, true);

    document.getElementById("innerDiv").addEventListener("click", () => {
      console.log("Inner Most div is clicked");
    }, true);
  </script>
</body>
</html>
